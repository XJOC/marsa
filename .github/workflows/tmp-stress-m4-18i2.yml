name: tmp-stress-m4-18i2
# Temporary: runs the DNS port tests many times on Windows. Removed before merge.
on:
  push:
    branches: ["task/M4-18i2-dns-test-flake"]
permissions:
  contents: read
jobs:
  stress:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run -p marsa held --stress-count 300
  # The same on main, before the fix: does the old test fail under stress?
  stress-main:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run -p marsa held --stress-count 300 --no-fail-fast
