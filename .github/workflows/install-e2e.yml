name: install-e2e

# The goal of milestone 2 (task M2-08): `marsa install php 8.4`, `node 22`,
# and `composer` from the signed runtimes manifest, on the three systems and
# both architectures, and the programs run; and the published signed list
# checks out with the key built into marsa. The jobs download from the real
# internet, so they are not part of the tests that `cargo nextest` runs. Weekly,
# so a file a source took down is found before a user finds it.

on:
  workflow_dispatch:
  schedule:
    # Mondays, 05:17 UTC.
    - cron: "17 5 * * 1"
  push:
    branches: ["task/M2-08*"]

# Read-only on purpose: the job never writes to the repository.
permissions:
  contents: read

# A new run on the same branch cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  install:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          # The last Intel Mac image, until August 2027.
          - macos-15-intel
          - ubuntu-22.04
          - ubuntu-24.04-arm
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # Reads the pinned version from rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Build marsa and marsad
        run: cargo build --release -p marsa

      # Built alone: workspace feature unification would drag tokio into the
      # shim (architecture.md section 3).
      - name: Build the shim
        run: cargo build --release -p marsa-shim

      - name: Install and run PHP, Node, and Composer
        run: bash tools/e2e/install.sh

  # The signed list as a user's marsa downloads it: from the public release
  # link, with no login, checked with the key built into marsa.
  manifest:
    name: published manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          key: manifest

      - name: Download manifest.json and its signature
        run: |
          base=https://github.com/XJOC/marsa/releases/download/runtimes-manifest
          mkdir -p "$RUNNER_TEMP/manifest"
          for file in manifest.json manifest.json.minisig; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/manifest/$file" "$base/$file"
          done
          ls -l "$RUNNER_TEMP/manifest"

      - name: cargo xtask manifest verify
        run: |
          out=$(cargo xtask manifest verify "$RUNNER_TEMP/manifest/manifest.json")
          echo "$out"
          grep -q "^Local JSON check: OK" <<<"$out"
          grep -q "^Signature: OK with the key built into marsa" <<<"$out"
