name: spike-s08

on:
  workflow_dispatch:
    inputs:
      # Manual only: nothing is published on a push (task S-08b, owner's call).
      publish:
        description: "Publish the spike-s08 pre-release"
        type: boolean
        default: false
  push:
    branches: [task/S-08b-install-update]
    paths:
      - "spikes/s08-tauri/**"
      - ".github/workflows/spike-s08.yml"

# Read for every job. Only `publish` raises itself to `contents: write`.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            os: macos-latest
            triple: aarch64-apple-darwin
          - label: windows-x64
            os: windows-latest
            triple: x86_64-pc-windows-msvc
          - label: linux-x64
            os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - label: linux-arm64
            os: ubuntu-22.04-arm
            triple: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Reads the pnpm version from the packageManager field.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: spikes/s08-tauri/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: spikes/s08-tauri/.nvmrc
          cache: pnpm
          cache-dependency-path: spikes/s08-tauri/pnpm-lock.yaml

      # Installs the toolchain pinned by rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        working-directory: spikes/s08-tauri
        run: rustup toolchain install --profile default

      - name: pnpm install
        working-directory: spikes/s08-tauri
        run: pnpm install --frozen-lockfile

      # tauri-build (build.rs) validates externalBin at compile time, so the
      # sidecar must exist with its target-triple name before cargo runs.
      - name: Prepare the sidecar binary
        working-directory: spikes/s08-tauri
        run: pnpm run prepare:sidecar

      # One archive per triple, the name `download_and_run` asks for. Inside,
      # the binary keeps its plain name (no triple) so the app can find it
      # after unpacking (task S-08b, plan review item 4).
      - name: Pack the sidecar archive (Windows and Linux)
        if: runner.os != 'macOS'
        working-directory: spikes/s08-tauri
        run: |
          set -euo pipefail
          name=s08-sidecar
          if [ "${{ runner.os }}" = "Windows" ]; then name=s08-sidecar.exe; fi
          tar -czf "s08-sidecar-${{ matrix.triple }}.tar.gz" -C target/release "$name"

      - uses: actions/upload-artifact@v4
        if: runner.os != 'macOS'
        with:
          name: s08-sidecar-${{ matrix.triple }}
          path: spikes/s08-tauri/s08-sidecar-${{ matrix.triple }}.tar.gz

      # generate_context! embeds dist/ in release builds: build it first.
      - name: Build the frontend
        working-directory: spikes/s08-tauri
        run: pnpm run build

      - name: cargo fmt
        working-directory: spikes/s08-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: spikes/s08-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Report steps print and never fail the job (task S-08a).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
        continue-on-error: true

      - name: Report license check (cargo deny)
        working-directory: spikes/s08-tauri
        continue-on-error: true
        run: cargo deny check licenses

      # A .dmg failure is a recorded result, not a stop (task S-08a). Build
      # and upload the .dmg FIRST: a dmg-only build deletes the .app it
      # stages ("Cleaning .../bundle/macos/s08-app.app"), because the .app is
      # an intermediate when it is not a requested bundle.
      - name: Build the .dmg
        if: runner.os == 'macOS'
        working-directory: spikes/s08-tauri
        continue-on-error: true
        run: pnpm tauri build --bundles dmg

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: s08-macos-arm64-dmg
          path: spikes/s08-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

      - name: Build the app bundle (macOS .app)
        if: runner.os == 'macOS'
        working-directory: spikes/s08-tauri
        run: pnpm tauri build --bundles app

      # Acceptance criterion: both binaries must be ad-hoc signed.
      - name: Verify ad-hoc signatures (macOS)
        if: runner.os == 'macOS'
        working-directory: spikes/s08-tauri
        run: |
          set -euo pipefail
          app="target/release/bundle/macos/s08-app.app"
          for binary in "$app/Contents/MacOS/s08-app" "$app/Contents/MacOS/s08-sidecar"; do
            echo "== $binary"
            codesign -dv --verbose=4 "$binary" 2>&1 | tee /tmp/codesign.txt
            grep -q 'Signature=adhoc' /tmp/codesign.txt
            codesign --verify --deep --strict --verbose=2 "$binary"
          done
          codesign --verify --deep --strict --verbose=2 "$app"

      # From inside the .app, after the signature check: the bundler re-signs
      # the sidecar, so the copy next to it in target/release is stale.
      - name: Pack the sidecar archive (macOS)
        if: runner.os == 'macOS'
        working-directory: spikes/s08-tauri
        run: |
          set -euo pipefail
          dir=target/release/bundle/macos/s08-app.app/Contents/MacOS
          tar -czf "s08-sidecar-${{ matrix.triple }}.tar.gz" -C "$dir" s08-sidecar

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: s08-sidecar-${{ matrix.triple }}
          path: spikes/s08-tauri/s08-sidecar-${{ matrix.triple }}.tar.gz

      # upload-artifact zips and drops permissions and symlinks, so the .app
      # travels inside a tar.gz (task S-08a).
      - name: Pack the .app for upload
        if: runner.os == 'macOS'
        working-directory: spikes/s08-tauri/target/release/bundle
        run: tar -czf s08-app-macos.tar.gz macos/s08-app.app

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: s08-macos-arm64-app
          path: spikes/s08-tauri/target/release/bundle/s08-app-macos.tar.gz

      - name: Build the NSIS installer (per-user)
        if: runner.os == 'Windows'
        working-directory: spikes/s08-tauri
        run: pnpm tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: s08-windows-x64-nsis
          path: spikes/s08-tauri/target/release/bundle/nsis/*.exe

      - name: Build .deb and .AppImage
        if: runner.os == 'Linux'
        working-directory: spikes/s08-tauri
        run: pnpm tauri build --bundles deb,appimage

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: s08-${{ matrix.label }}-deb
          path: spikes/s08-tauri/target/release/bundle/deb/*.deb

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: s08-${{ matrix.label }}-appimage
          path: spikes/s08-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

      # Report steps: print only, never fail the job.
      - name: Report artifact sizes
        if: always()
        working-directory: spikes/s08-tauri
        continue-on-error: true
        run: |
          if [ -d target/release/bundle ]; then
            find target/release/bundle -mindepth 1 -maxdepth 2 \( -type f -o -type d \) -exec du -sh {} +
          else
            echo "no bundle directory"
          fi

      - name: Report the highest required GLIBC version (Linux)
        if: always() && runner.os == 'Linux'
        working-directory: spikes/s08-tauri
        continue-on-error: true
        run: |
          for binary in target/release/s08-app target/release/s08-sidecar; do
            echo "== $binary"
            if [ -f "$binary" ]; then
              objdump -p "$binary" | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -n 1
            else
              echo "missing"
            fi
          done

  # Manual only, so the pre-release never appears by accident. Run:
  #   GH_TOKEN="$(gh auth token --user XJOC)" gh workflow run spike-s08.yml \
  #     --repo XJOC/marsa --ref task/S-08b-install-update -f publish=true
  publish:
    name: publish the spike-s08 pre-release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # One file with the checksum of every output and archive.
      - name: Write SHA256SUMS
        working-directory: artifacts
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # A re-run finds the release and keeps it; `--target` pins the tag to the
      # commit that was tested instead of the default branch head.
      - name: Create the pre-release when it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view spike-s08 --repo XJOC/marsa >/dev/null 2>&1 ||
            gh release create spike-s08 --repo XJOC/marsa --prerelease \
              --title "S-08 spike (pre-release)" --target "${{ github.sha }}"

      - name: Upload the artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload spike-s08 --repo XJOC/marsa --clobber artifacts/*
