name: valkey-e2e

# Valkey 8.1 as a service of marsad, with a real server (ADR 0023): the
# start on 127.0.0.1 only, the idle memory, the access rules
# (CONFIG SET dir and dbfilename, DEBUG, and MODULE LOAD refused over TCP),
# phpredis, SHUTDOWN SAVE at the stop and the data at the next start, the
# refusals, the start with marsad, and an orphan stopped with SIGTERM.
# tools/e2e/valkey.sh unpacks the archive given and runs every marsa command
# with --data-dir in a new folder. No sudo. It is not part of the tests that
# `cargo nextest` runs.
#
# The archive is the one of our published release, which the script names. A
# run by hand can give another one, such as a new build's.

on:
  workflow_dispatch:
    inputs:
      archive:
        description: "Empty: the published release. Or an https URL, with {platform} for darwin-arm64, darwin-x64, linux-x64, or linux-arm64; its folder must hold sha256sums.txt."
        required: false
        default: ""
      version:
        description: "The Valkey version in the archive (empty: the script's own)"
        required: false
        default: ""
  # Every pull request that changes these paths, so a change to the Valkey
  # code runs this before it merges, and main after it.
  pull_request:
    paths:
      - "crates/app/src/daemon/services/databases/**"
      - "crates/app/src/daemon/services/api.rs"
      - "crates/app/src/cli/strings/**"
      - "crates/app/src/cli/services.rs"
      - "crates/app/src/daemon/runtimes/api.rs"
      - "crates/app/src/daemon/services/supervisor.rs"
      - "crates/core/src/databases/**"
      - "crates/core/src/platform/process/**"
      - "recipes/valkey.toml"
      - "tools/e2e/valkey.sh"
      - "crates/app/src/daemon/db_browser/**"
      - "crates/core/src/db_browser/**"
      - "crates/app/src/cli/db.rs"
      - "crates/app/src/cli/db/**"
      - ".github/workflows/valkey-e2e.yml"
  push:
    branches: [main]
    paths:
      - "crates/app/src/daemon/services/databases/**"
      - "crates/app/src/daemon/services/api.rs"
      - "crates/app/src/cli/strings/**"
      - "crates/app/src/cli/services.rs"
      - "crates/app/src/daemon/runtimes/api.rs"
      - "crates/app/src/daemon/services/supervisor.rs"
      - "crates/core/src/databases/**"
      - "crates/core/src/platform/process/**"
      - "recipes/valkey.toml"
      - "tools/e2e/valkey.sh"
      - "crates/app/src/daemon/db_browser/**"
      - "crates/core/src/db_browser/**"
      - "crates/app/src/cli/db.rs"
      - "crates/app/src/cli/db/**"
      - ".github/workflows/valkey-e2e.yml"

# Read-only on purpose: the job never writes to the repository.
permissions:
  contents: read

# A new run on the same branch cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  e2e:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Our macOS builds (arm64 and Intel, macOS 12 and later) and our
        # static musl builds for Linux (x64 and arm64).
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # The job runs downloaded programs: no token is left in .git.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Reads the pinned version from rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Build marsa and marsad
        run: cargo build --release -p marsa

      # The inputs reach the script as variables, never inside its text.
      - name: End to end
        env:
          VALKEY_ARCHIVE: ${{ inputs.archive }}
          VALKEY_VERSION: ${{ inputs.version }}
          # The pid record of the server and the checks of the orphan: what
          # a failed run needs in logs/marsad.log.
          MARSA_LOG: info,marsa::daemon::services::databases=debug
        run: bash tools/e2e/valkey.sh

      # Logs only. `run/daemon.json` holds the daemon token and is never
      # uploaded.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: valkey-e2e-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/vk-e2e/logs/
          if-no-files-found: ignore
