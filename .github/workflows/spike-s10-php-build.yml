name: spike-s10-php-build

# Spike S-10: build our own static PHP (cli + fpm + shared Xdebug) with
# static-php-cli on GitHub runners, with the extension set Laravel needs.
# Nothing is released: binaries are uploaded as workflow artifacts only.
# Files: spikes/s10-php-build/ (extension lists, scripts). ADR: docs/decisions/.

on:
  push:
    branches: ["task/S-10-*"]
    paths:
      - "spikes/s10-php-build/**"
      - ".github/workflows/spike-s10-php-build.yml"
  workflow_dispatch:
    inputs:
      php_version:
        description: "PHP version: 8.4 (newest 8.4.x) or a full version such as 8.4.23"
        type: string
        default: "8.4"
      prefer_pre_built:
        description: "Use static-php.dev pre-built libraries (false = build every library from source)"
        type: choice
        options: ["true", "false"]
        default: "true"

permissions:
  contents: read

# A new push to the branch cancels the older run, so a fix does not queue behind it.
concurrency:
  group: spike-s10-${{ github.ref }}
  cancel-in-progress: true

env:
  # The pinned static-php-cli release (line 2.8, ADR 0010). The sha256 of each
  # asset is in spikes/s10-php-build/spc.sha256.
  SPC_VERSION: "2.8.5"
  PHP_VERSION: ${{ inputs.php_version || '8.4' }}
  # spc reads this to avoid GitHub API rate limits when it downloads sources.
  GITHUB_TOKEN: ${{ github.token }}
  # spc's default Xdebug source is the newest commit (3.6.0alpha1 in run 1). Pin the
  # release ADR 0010 used. sha256 as recorded in spikes/s03-xdebug/results/downloads.txt.
  XDEBUG_URL: "https://xdebug.org/files/xdebug-3.5.3.tgz"
  XDEBUG_SHA256: "f073de91bea046106abf4d6071c963ea71e58571df6ce58948ceca89d121cb2d"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS links the system libraries dynamically, so it can load xdebug.so.
          - label: macos-arm64
            os: macos-15
            spc_asset: spc-macos-aarch64
            spc_target: ""
            shared: xdebug
            dlopen: "true"
            prebuilt: "true"
          - label: macos-x64
            os: macos-15-intel
            spc_asset: spc-macos-x86_64
            spc_target: ""
            shared: xdebug
            dlopen: "true"
            prebuilt: "true"
          # Linux glibc 2.17 (zig toolchain): can load xdebug.so, runs on any glibc distro.
          # prebuilt "false": the static-php.dev pre-built ICU is built with libstdc++, and zig
          # links libc++, so linking fails (run 1: undefined std::condition_variable). Build
          # every library from source with zig.
          - label: linux-x64-glibc
            os: ubuntu-22.04
            spc_asset: spc-linux-x86_64
            spc_target: native-native-gnu.2.17
            shared: xdebug
            dlopen: "true"
            prebuilt: "false"
          - label: linux-arm64-glibc
            os: ubuntu-22.04-arm
            spc_asset: spc-linux-aarch64
            spc_target: native-native-gnu.2.17
            shared: xdebug
            dlopen: "true"
            prebuilt: "false"
          # Linux static musl (what static-php.dev publishes): runs on any Linux
          # including Alpine, but cannot load a .so, so no Xdebug (ADR 0010).
          - label: linux-x64-musl
            os: ubuntu-22.04
            spc_asset: spc-linux-x86_64
            spc_target: ""
            shared: ""
            dlopen: "false"
            prebuilt: "true"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      LABEL: ${{ matrix.label }}
      SPIKE: ${{ github.workspace }}/spikes/s10-php-build
      WORK: ${{ github.workspace }}/spikes/s10-php-build/work
      OUT: ${{ github.workspace }}/spikes/s10-php-build/out
      SPC_TARGET: ${{ matrix.spc_target }}
      SHARED: ${{ matrix.shared }}
      DLOPEN: ${{ matrix.dlopen }}
      # A manual run with prefer_pre_built=false forces a from-source build everywhere.
      PREFER_PRE_BUILT: ${{ inputs.prefer_pre_built == 'false' && 'false' || matrix.prebuilt }}
    steps:
      - uses: actions/checkout@v5

      - name: Download spc ${{ env.SPC_VERSION }} and check its sha256
        run: |
          mkdir -p "$WORK" "$OUT"
          cd "$WORK"
          asset="${{ matrix.spc_asset }}.tar.gz"
          curl -fsSL --retry 3 -o "$asset" "https://github.com/crazywhalecc/static-php-cli/releases/download/${SPC_VERSION}/${asset}"
          expected="$(grep " ${asset}\$" "$SPIKE/spc.sha256" | cut -d' ' -f1)"
          actual="$( (sha256sum "$asset" 2> /dev/null || shasum -a 256 "$asset") | cut -d' ' -f1)"
          echo "expected $expected"
          echo "actual   $actual"
          [ -n "$expected" ] && [ "$expected" = "$actual" ] || { echo "spc checksum mismatch"; exit 1; }
          tar -xzf "$asset"
          ls -l
          chmod +x spc
          ./spc --version

      - name: Build PHP (doctor, download, build)
        id: build
        run: bash "$SPIKE/build.sh"

      - name: Smoke tests
        id: smoke
        if: steps.build.outcome == 'success'
        run: |
          CAFILE=""
          if [ -f /etc/ssl/cert.pem ]; then CAFILE=/etc/ssl/cert.pem; fi
          if [ -z "$CAFILE" ] && [ -f /etc/ssl/certs/ca-certificates.crt ]; then CAFILE=/etc/ssl/certs/ca-certificates.crt; fi
          export CAFILE
          xdebug=""
          if [ -f "$WORK/buildroot/modules/xdebug.so" ]; then xdebug="$WORK/buildroot/modules/xdebug.so"; fi
          bash "$SPIKE/smoke.sh" "$WORK/buildroot/bin/php" "$WORK/buildroot/bin/php-fpm" "$xdebug"

      # A fresh Laravel project on this PHP. Recorded in the summary; it does not fail the job.
      - name: Laravel check
        id: laravel
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: bash "$SPIKE/laravel-check.sh" "$WORK/buildroot/bin/php" "$WORK/laravel"

      - name: Package
        if: steps.build.outcome == 'success'
        run: |
          br="$WORK/buildroot"
          ver="$("$br/bin/php" -n -r 'echo PHP_VERSION;')"
          minor="${ver%.*}"
          mkdir -p "$OUT/pkg/bin" "$OUT/dist"
          cp "$br/bin/php" "$br/bin/php-fpm" "$OUT/pkg/bin/"
          tar -czf "$OUT/dist/php-${ver}-${LABEL}.tar.gz" -C "$OUT/pkg" bin
          if [ -f "$br/modules/xdebug.so" ]; then
            cp "$br/modules/xdebug.so" "$OUT/dist/xdebug-${minor}-${LABEL}.so"
          fi
          ( cd "$OUT/dist" && (sha256sum -- * 2> /dev/null || shasum -a 256 -- *) ) > "$OUT/sha256sums.txt"
          cat "$OUT/sha256sums.txt"
          mkdir -p "$OUT/meta"
          cp -R "$br/license" "$OUT/meta/license" 2> /dev/null || true
          cp "$br"/build-extensions.json "$br"/build-libraries.json "$OUT/meta/" 2> /dev/null || true

      - name: Report
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          LARAVEL_OUTCOME: ${{ steps.laravel.outcome }}
        run: bash "$SPIKE/report.sh"

      - name: Upload binaries
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.label }}
          path: spikes/s10-php-build/out/dist/*
          retention-days: 14
          if-no-files-found: error

      - name: Upload logs and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-${{ matrix.label }}
          path: |
            spikes/s10-php-build/work/log/
            spikes/s10-php-build/out/*.txt
            spikes/s10-php-build/out/*.md
            spikes/s10-php-build/out/fpm/
            spikes/s10-php-build/out/meta/
          retention-days: 14
          if-no-files-found: warn

  report:
    name: combined report
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: meta-*
          path: meta
      - name: Combine the rows
        run: |
          {
            echo "## S-10 results"
            echo
            echo "| platform | PHP | build | smoke | Laravel | php MB | php-fpm MB | tar.gz MB | xdebug.so MB | doctor min | download min | build min | total min |"
            echo "| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |"
            find meta -name 'row-*.md' | sort | while read -r f; do cat "$f"; done
          } >> "$GITHUB_STEP_SUMMARY"
