name: linux-e2e

# The Linux side of the Phase 1 gate (task M4-18f): from the built programs
# to an open Laravel page, on real Ubuntu machines. The job downloads
# runtimes and changes the system with sudo, which is fine here and only
# here: a runner is thrown away after the job. It is not part of the tests
# that `cargo nextest` runs.

on:
  workflow_dispatch:
  push:
    branches: ["task/M4-18*", main]
    paths:
      - "crates/helper/**"
      - "crates/core/src/platform/**"
      - "crates/core/src/caddy.rs"
      - "crates/core/src/dns.rs"
      - "crates/core/src/helper.rs"
      - "crates/app/src/daemon/**"
      - "tools/e2e/**"
      - ".github/workflows/linux-e2e.yml"

# Read-only on purpose: the job never writes to the repository.
permissions:
  contents: read

# A new run on the same branch cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  e2e:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Reads the pinned version from rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal

      # One cache per system: objects built on 24.04 use symbols of its newer
      # glibc (`__isoc23_sscanf`) and fail to link on 22.04.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Build marsa, marsad, and marsa-helper
        run: cargo build --release -p marsa -p marsa-helper

      # Built alone: workspace feature unification would drag tokio into the
      # shim (architecture.md section 3).
      - name: Build the shim
        run: cargo build --release -p marsa-shim

      # Temporary: PHP 8.4.27 fails its check on Ubuntu 22.04. Shows why.
      - name: Probe the PHP build on this system
        continue-on-error: true
        run: |
          dir="$(mktemp -d)"
          curl -fsSL -o "$dir/php.tgz" https://github.com/XJOC/marsa/releases/download/php-8.4.27-r1/php-8.4.27-linux-x64.tar.gz
          tar -xzf "$dir/php.tgz" -C "$dir"
          find "$dir" -maxdepth 3 -type f | head -n 20
          php="$(find "$dir" -type f -name php | head -n 1)"
          ldd --version | head -n 1
          grep -m1 'model name' /proc/cpuinfo
          for flag in sse4_2 avx avx2 bmi2 avx512f avx512bw avx512vl; do
            grep -qw "$flag" /proc/cpuinfo && echo "cpu has $flag" || echo "cpu LACKS $flag"
          done
          echo "zmm (AVX-512) instructions in php: $(objdump -d --no-show-raw-insn "$php" | grep -c zmm || true)"
          echo "ymm (AVX) instructions in php: $(objdump -d --no-show-raw-insn "$php" | grep -c ymm || true)"
          file "$php"
          ldd "$php" || true
          readelf -l "$php" | grep -E 'INTERP|interpreter|GNU_PROPERTY|LOAD' | head -n 12 || true
          readelf -d "$php" | head -n 30 || true
          readelf -V "$php" | grep -o 'GLIBC_[0-9.A-Z_]*' | sort -uV | tail -n 8 || true
          set +e
          "$php" -v
          echo "php -v: exit $?"
          env -i "$php" -v
          echo "env -i php -v: exit $?"
          "$php" -n -v
          echo "php -n -v: exit $?"
          strace -f -o "$dir/trace" "$php" -v >/dev/null 2>&1
          tail -n 25 "$dir/trace"
          sudo dmesg | tail -n 8

      - name: End to end
        env:
          # Composer downloads packages from GitHub. With the job's own
          # read-only token it is not held back by the anonymous rate limit.
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
        run: bash tools/e2e/linux.sh

      # Logs only. `run/daemon.json` holds the daemon token and is never
      # uploaded.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: marsa-logs-${{ matrix.os }}
          path: ~/.local/share/marsa/logs
          if-no-files-found: ignore
