name: windows-databases-e2e

# MySQL, PostgreSQL, and Valkey as services of marsad on Windows, with real
# servers, run by a plain local user that is only in Users (ADR 0023): the
# first init, the start as a direct child of marsad, a clean stop
# by each server's own way (mysqladmin shutdown, pg_ctl stop -m fast,
# SHUTDOWN SAVE) with no recovery at the next start, Valkey's Cygwin paths in
# a folder with spaces, marsad ended by force with the servers ending in its
# Job Object and their data recovered at the next start, and an elevated
# marsad that starts no PostgreSQL. tools/e2e/windows-databases.ps1 creates
# the user and runs every marsa command with --data-dir. It is not part of
# the tests that `cargo nextest` runs.
#
# Valkey's Windows archive comes from our published release: the script
# downloads it and checks it against sha256sums.txt. A run by hand with
# `valkey_run` tests a new build before its release instead, from the artifact
# of that valkey-build run (artifacts last 14 days). Without an archive the
# job fails.

on:
  workflow_dispatch:
    inputs:
      valkey_run:
        description: "Empty: the published release. Or the id of a valkey-build run, to test the Windows archive in its artifact valkey-windows-x64"
        required: false
        default: ""
  pull_request:
    paths:
      - "crates/app/src/daemon/services/databases/**"
      - "crates/app/src/daemon/services/supervisor.rs"
      - "crates/core/src/databases/**"
      - "crates/core/src/services.rs"
      - "crates/core/src/platform/windows/**"
      - "crates/core/src/platform.rs"
      - "recipes/mysql.toml"
      - "recipes/postgres.toml"
      - "recipes/valkey.toml"
      - "tools/e2e/windows-databases.ps1"
      - "crates/app/src/daemon/db_browser/**"
      - "crates/core/src/db_browser/**"
      - "crates/app/src/cli/db.rs"
      - "crates/app/src/cli/db/**"
      - ".github/workflows/windows-databases-e2e.yml"

# Read-only on purpose: the job never writes to the repository. `actions:
# read` lets it download the artifact of another run.
permissions:
  contents: read
  actions: read

# A new run on the same branch cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: windows-2025
    # Pinned, not windows-latest: the run is evidence for one system.
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      # The job runs downloaded programs: no token is left in .git.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Only a run by hand that names a run. A missing or expired artifact
      # fails the job here, before the build.
      - name: Valkey's Windows archive from a valkey-build run
        if: inputs.valkey_run
        uses: actions/download-artifact@v4
        with:
          name: valkey-windows-x64
          run-id: ${{ inputs.valkey_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/valkey-artifact

      # Reads the pinned version from rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-databases-e2e

      - name: Build marsa and marsad
        run: cargo build --release -p marsa

      - name: End to end
        shell: pwsh
        timeout-minutes: 40
        env:
          # Empty without `valkey_run`: the script then takes the release.
          VALKEY_ZIP: ${{ inputs.valkey_run && format('{0}\valkey-artifact\valkey-8.1.11-windows-x64.zip', runner.temp) || '' }}
        run: ./tools/e2e/windows-databases.ps1

      # Logs only, copied there by the script after a failure.
      # `run\daemon.json` holds the daemon token and is never uploaded.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-databases-e2e-logs
          path: ${{ runner.temp }}/marsa-db-logs
          if-no-files-found: ignore
