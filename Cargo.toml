[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/shim", "crates/helper", "crates/gui", "xtask"]
# The Tauri spike is a separate workspace on purpose: throwaway code, never a
# product member (task S-08a). `tools/` holds dev tools with their own
# dependencies, such as the `minisign` signer for test fixtures (task M2-02).
exclude = ["spikes", "tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Every dependency is declared here once; crates use `name.workspace = true`.
[workspace.dependencies]
# Binaries only (AGENTS.md section 8): the libraries use `thiserror`.
anyhow = "1"
# The daemon API server (task M3-01).
axum = "0.8"
# `derive`: subcommands as structs in `marsa` and `xtask` (task M2-01).
clap = { version = "4", features = ["derive"] }
directories = "6"
# The window (ADR 0007): `wgpu` only, no `glow`. `wayland` and `x11` so one
# binary runs on both Linux display servers. Left out: `system_fonts` (an extra
# font crate), `links` and `web_screen_reader` (not needed), and `accesskit`:
# on Linux it pulls zbus 5, whose `zbus_names` and `zvariant` crates are
# unmaintained (RUSTSEC-2026-0371 and others). Bring it back with zbus 6 (M5).
# `links`: clicking a site URL opens the browser (task M4-15); it adds only
# the small `webbrowser` crate.
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "links", "wayland", "wgpu", "x11"] }
egui_extras = "0.37"
# Default backend `rust_backend` (miniz_oxide): pure Rust, no C zlib.
flate2 = "1"
# The DNS server in marsad that answers *.test with 127.0.0.1 (task M4-12).
# No features: plain UDP and TCP, no DNSSEC, TLS, resolver, or sqlite.
hickory-server = { version = "0.26", default-features = false }
# The daemon token: 32 bytes from the OS random source (task M3-03). Already
# in the tree through `tempfile`; approved by the owner on 2026-11-04.
getrandom = "0.4"
# Generated Caddy config is tested with snapshots (task M3-05).
insta = { version = "1", features = ["json"] }
minisign-verify = "0.3"
notify = "8"
# `json`: typed calls to the daemon API and to the Caddy admin API (task M3-01).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# The folder picker of the window's "Park a folder…" and "Link a folder…"
# (task M5-10). On Linux `xdg-portal` and not GTK: the desktop's own dialog,
# through libdbus loaded at run time (zenity if there is none), so nothing new
# to build against. Without `wayland`: it only ties the dialog to the window
# on Wayland, with more unsafe code; the dialog works without it.
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
# No extra features: `Value` reads two keys from `composer.json` and
# `package.json` (task M1-04), and typed structs read the manifest (M2-02).
serde_json = { version = "1", default-features = false, features = ["std"] }
sha2 = "0.11"
# The SHA-1 thumbprint of Marsa's CA on Windows (task M4-19e, ADR 0018):
# `certutil` finds a certificate by it and not by a SHA-256. It only finds
# the certificate and never decides about trust.
sha1 = "0.11"
# No `xattr`: the installer does not keep extended attributes (task M2-03).
tar = { version = "0.4", default-features = false }
# The menu-bar icon `marsa-tray` (task M5-04): `tao` runs the event loop on
# the main thread, `tray-icon` draws the icon and its menu (muda). Without
# `dbus`: tao uses it for the desktop portal of a window, and the tray opens
# none; leaving it out saves libdbus at build and run time on Linux.
tao = { version = "0.37", default-features = false, features = ["rwh_06", "x11"] }
tempfile = "3"
thiserror = "2"
tray-icon = "0.26"
# No `preserve_order` or other extras: the shim depends on the core, so its size
# matters. `serde` and `display` read and write the config files with derive;
# the owner accepted the size cost (task M1-05).
toml = { version = "1", default-features = false, features = ["std", "parse", "serde", "display"] }
tokio = { version = "1", features = ["full"] }
# `sync`: `BroadcastStream` turns the event bus into an SSE stream (task M3-01).
tokio-stream = { version = "0.1", features = ["sync"] }
# `CancellationToken`: one per managed process (architecture.md section 5).
tokio-util = "0.7"
# `util`: `ServiceExt::oneshot` tests the daemon router without a socket.
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
# `env-filter`: `MARSA_LOG=debug` raises the log level (task M2-06).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Win32 calls with no safe wrapper in std: the daemon's Job Object and a
# process start that inherits no handles (task M4-19a, ADR 0017). Only on
# Windows, and only the API families named here.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
# The Windows helper service: the SCM dispatcher, its control handler, and
# its install (ADR 0018). Windows only, in `marsa-helper`.
windows-service = "0.8"
# Deflate through flate2 only (the same crate as above, so one backend). No
# bzip2, zstd, lzma, aes, or zopfli: the archives we read do not use them.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

# Architecture rule: a lock is never held across `.await`, and `unwrap()` is
# banned outside tests (AGENTS.md section 6).
[workspace.lints.clippy]
await_holding_lock = "deny"
unwrap_used = "deny"
