[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/shim", "crates/helper", "xtask"]
# The Tauri spike is a separate workspace on purpose: throwaway code, never a
# product member (task S-08a).
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

# Every dependency is declared here once; crates use `name.workspace = true`.
[workspace.dependencies]
# Binaries only (AGENTS.md section 8): the libraries use `thiserror`.
anyhow = "1"
clap = "4"
directories = "6"
notify = "8"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
# Only `Value` is used, to read two keys from `composer.json` and
# `package.json`; no derive, so no `serde_derive` build time (task M1-04).
serde_json = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"
thiserror = "2"
# No `preserve_order` or other extras: the shim depends on the core, so its size
# matters. `serde` and `display` read and write the config files with derive;
# the owner accepted the size cost (task M1-05).
toml = { version = "1", default-features = false, features = ["std", "parse", "serde", "display"] }
tokio = { version = "1", features = ["full"] }

# Architecture rule: a lock is never held across `.await`, and `unwrap()` is
# banned outside tests (AGENTS.md section 6).
[workspace.lints.clippy]
await_holding_lock = "deny"
unwrap_used = "deny"
