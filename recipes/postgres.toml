# How PostgreSQL is laid out on disk (task M6-01, ADR 0023). See php.toml for
# how a recipe and the signed manifest work together.
name = "postgres"

# After install: `postgres --version` prints `postgres (PostgreSQL) 17.12`,
# while the release is called 17.12.0 (theseus-rs adds a patch number that
# PostgreSQL 10 and newer do not have). `{major}.{minor}` is `17.12`.
[check]
program = "postgres"
args = ["--version"]
expect_prefix = "postgres (PostgreSQL) {major}.{minor}"

# The prebuilt binaries of theseus-rs/postgresql-binaries, as they are. Every
# archive has one top folder, `postgresql-<version>-<target>/`, with bin/,
# lib/, share/, and the licenses inside; strip_components = 1 removes it.
# Linux builds need glibc 2.36 (built on Debian 12) and macOS builds need
# macOS 15 (S-12, ADR 0023), so older systems are refused before the download.

[platform.darwin-arm64]
min_macos = "15.0"
programs = { postgres = "bin/postgres", initdb = "bin/initdb", pg_ctl = "bin/pg_ctl", psql = "bin/psql", pg_dump = "bin/pg_dump", pg_restore = "bin/pg_restore", pg_isready = "bin/pg_isready" }

[[platform.darwin-arm64.artifact]]
name = "archive"
url = "https://github.com/theseus-rs/postgresql-binaries/releases/download/{version}/postgresql-{version}-aarch64-apple-darwin.tar.gz"
format = "tar.gz"
strip_components = 1

[platform.darwin-x64]
min_macos = "15.0"
programs = { postgres = "bin/postgres", initdb = "bin/initdb", pg_ctl = "bin/pg_ctl", psql = "bin/psql", pg_dump = "bin/pg_dump", pg_restore = "bin/pg_restore", pg_isready = "bin/pg_isready" }

[[platform.darwin-x64.artifact]]
name = "archive"
url = "https://github.com/theseus-rs/postgresql-binaries/releases/download/{version}/postgresql-{version}-x86_64-apple-darwin.tar.gz"
format = "tar.gz"
strip_components = 1

[platform.linux-x64]
min_glibc = "2.36"
programs = { postgres = "bin/postgres", initdb = "bin/initdb", pg_ctl = "bin/pg_ctl", psql = "bin/psql", pg_dump = "bin/pg_dump", pg_restore = "bin/pg_restore", pg_isready = "bin/pg_isready" }

[[platform.linux-x64.artifact]]
name = "archive"
url = "https://github.com/theseus-rs/postgresql-binaries/releases/download/{version}/postgresql-{version}-x86_64-unknown-linux-gnu.tar.gz"
format = "tar.gz"
strip_components = 1

[platform.linux-arm64]
min_glibc = "2.36"
programs = { postgres = "bin/postgres", initdb = "bin/initdb", pg_ctl = "bin/pg_ctl", psql = "bin/psql", pg_dump = "bin/pg_dump", pg_restore = "bin/pg_restore", pg_isready = "bin/pg_isready" }

[[platform.linux-arm64.artifact]]
name = "archive"
url = "https://github.com/theseus-rs/postgresql-binaries/releases/download/{version}/postgresql-{version}-aarch64-unknown-linux-gnu.tar.gz"
format = "tar.gz"
strip_components = 1

[platform.windows-x64]
programs = { postgres = "bin/postgres.exe", initdb = "bin/initdb.exe", pg_ctl = "bin/pg_ctl.exe", psql = "bin/psql.exe", pg_dump = "bin/pg_dump.exe", pg_restore = "bin/pg_restore.exe", pg_isready = "bin/pg_isready.exe" }

[[platform.windows-x64.artifact]]
name = "archive"
url = "https://github.com/theseus-rs/postgresql-binaries/releases/download/{version}/postgresql-{version}-x86_64-pc-windows-msvc.zip"
format = "zip"
strip_components = 1
