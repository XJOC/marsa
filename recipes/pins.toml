# The versions the next signed runtimes manifest publishes (task M2-07).
# `cargo xtask manifest build` reads this file; a change here goes through a
# pull request, so the history of this file is the audit trail of what was
# published.

# Raise by one for every publish. `build` refuses a serial that is not greater
# than the published one. The owner signs with the trusted comment
# "marsa runtimes manifest serial=<serial>".
serial = 2

# static-php-cli line (ADR 0010): `php -v` must say "Built by static-php-cli 2.8.x".
# The exact spc release (2.8.5), zig (0.17.1) and Xdebug (3.5.3) of our PHP
# builds are pinned in .github/workflows/php-build.yml, with their sha256 in
# tools/php-build/downloads.sha256 (ADR 0012).
spc_line = "2.8"

[php]
# The newest 8.3, 8.4, and 8.5 (8.4.27 on 2026-11-04; 8.3.36 and 8.5.12 on
# 2026-11-11). macOS and Linux: our own build (ADR 0012).
versions = ["8.3.36", "8.4.27", "8.5.12"]

[node]
# The newest 22.x LTS (Jod) on 2026-11-04 and 24.x LTS (Krypton) on 2026-11-11.
versions = ["22.23.4", "24.22.2"]

[composer]
# The newest 2.x on 2026-11-04.
versions = ["2.11.1"]

[caddy]
# The official build (ADR 0008). 2.11.8 came out on 2026-11-04 with security
# fixes for `php_fastcgi` and file paths; S-01 tested 2.11.7. The release's
# caddy_<version>_checksums.txt (sha512) is checked by `manifest build`.
versions = ["2.11.8"]

# A URL for one version, platform, and artifact that replaces the recipe
# template. `urls`: the first is the main one, the rest are mirrors.

# PHP 8.4.27 for macOS and Linux: the archives of the GitHub Release
# php-8.4.27-r2, made by .github/workflows/php-build.yml (run it with
# release = true). The workflow makes it a DRAFT: these URLs answer only after
# it is published. A rebuild is a new release (r3) and new URLs here.
# r2 of every PHP version (2026-11-14, M2-13): the r1 Linux builds needed the
# build runner's CPU (AVX-512) and died with SIGILL on other CPUs.
[[override]]
runtime = "php"
version = "8.4.27"
platform = "darwin-arm64"
artifact = "php"
urls = ["https://github.com/XJOC/marsa/releases/download/php-8.4.27-r2/php-8.4.27-darwin-arm64.tar.gz"]

[[override]]
runtime = "php"
version = "8.4.27"
platform = "darwin-x64"
artifact = "php"
urls = ["https://github.com/XJOC/marsa/releases/download/php-8.4.27-r2/php-8.4.27-darwin-x64.tar.gz"]

[[override]]
runtime = "php"
version = "8.4.27"
platform = "linux-x64"
artifact = "php"
urls = ["https://github.com/XJOC/marsa/releases/download/php-8.4.27-r2/php-8.4.27-linux-x64.tar.gz"]

[[override]]
runtime = "php"
version = "8.4.27"
platform = "linux-arm64"
artifact = "php"
urls = ["https://github.com/XJOC/marsa/releases/download/php-8.4.27-r2/php-8.4.27-linux-arm64.tar.gz"]

# Windows: windows.php.net rebuilt 8.4.27 as "8.4.27-1", so the recipe
# template (without "-1") is 404. The archive folder is the mirror.
[[override]]
runtime = "php"
version = "8.4.27"
platform = "windows-x64"
artifact = "zip"
urls = [
  "https://windows.php.net/downloads/releases/php-8.4.27-1-nts-Win32-vs17-x64.zip",
  "https://windows.php.net/downloads/releases/archives/php-8.4.27-1-nts-Win32-vs17-x64.zip",
]

