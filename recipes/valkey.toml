# How Valkey 8.1 is laid out on disk (ADR 0023). See php.toml for how a recipe
# and the signed manifest work together.
name = "valkey"

# After install: `valkey-server --version` prints
# `Valkey server v=8.1.11 sha=00000000:0 malloc=libc bits=64 build=...`. The
# space after the version keeps 8.1.11 from matching 8.1.110.
[check]
program = "valkey-server"
args = ["--version"]
expect_prefix = "Valkey server v={version} "

# Our own builds (ADR 0023, section 1), made by .github/workflows/
# valkey-build.yml and published as one GitHub Release per build,
# `valkey-<version>-r<revision>`, with a sha256sums.txt beside the archives.
# One archive per platform, with no top folder: bin/valkey-server,
# bin/valkey-cli, licenses/, and BUILD-INFO.txt. No redis-cli: Marsa ships
# Valkey's own names only.
#
# - macOS: built with MACOSX_DEPLOYMENT_TARGET=12.0, linked to libSystem only.
# - Linux: static against musl, so no glibc floor.
# - Windows: built with Cygwin; bin/ also holds cygwin1.dll and
#   cyggcc_s-seh-1.dll, and the release holds the Cygwin source. Marsa does
#   not run Valkey on Windows yet, so pins.toml skips it.
#
# The URL is the first build (r1). A rebuild (r2) changes it here, not in
# pins.toml: `cargo xtask manifest build` accepts only the recipe's own file
# of our release, so an override cannot point at another archive.

[platform.darwin-arm64]
min_macos = "12.0"
programs = { valkey-server = "bin/valkey-server", valkey-cli = "bin/valkey-cli" }

[[platform.darwin-arm64.artifact]]
name = "archive"
url = "https://github.com/XJOC/marsa/releases/download/valkey-{version}-r1/valkey-{version}-darwin-arm64.tar.gz"
format = "tar.gz"
strip_components = 0
into = ""

[platform.darwin-x64]
min_macos = "12.0"
programs = { valkey-server = "bin/valkey-server", valkey-cli = "bin/valkey-cli" }

[[platform.darwin-x64.artifact]]
name = "archive"
url = "https://github.com/XJOC/marsa/releases/download/valkey-{version}-r1/valkey-{version}-darwin-x64.tar.gz"
format = "tar.gz"
strip_components = 0
into = ""

[platform.linux-x64]
programs = { valkey-server = "bin/valkey-server", valkey-cli = "bin/valkey-cli" }

[[platform.linux-x64.artifact]]
name = "archive"
url = "https://github.com/XJOC/marsa/releases/download/valkey-{version}-r1/valkey-{version}-linux-x64.tar.gz"
format = "tar.gz"
strip_components = 0
into = ""

[platform.linux-arm64]
programs = { valkey-server = "bin/valkey-server", valkey-cli = "bin/valkey-cli" }

[[platform.linux-arm64.artifact]]
name = "archive"
url = "https://github.com/XJOC/marsa/releases/download/valkey-{version}-r1/valkey-{version}-linux-arm64.tar.gz"
format = "tar.gz"
strip_components = 0
into = ""

[platform.windows-x64]
programs = { valkey-server = "bin/valkey-server.exe", valkey-cli = "bin/valkey-cli.exe" }

[[platform.windows-x64.artifact]]
name = "archive"
url = "https://github.com/XJOC/marsa/releases/download/valkey-{version}-r1/valkey-{version}-windows-x64.zip"
format = "zip"
strip_components = 0
into = ""
