# How PHP is laid out on disk (task M2-01). The signed manifest (M2-02) says
# which versions exist, and the real URL and sha256 of each file. This recipe
# says how to unpack them. `url` is a template for `cargo xtask manifest` only:
# the installer never downloads from it.
name = "php"

# After install (M2-05): run the program; its output must start with the text.
[check]
program = "php"
args = ["-v"]
expect_prefix = "PHP {version} "

# macOS and Linux: Marsa's own static-php-cli builds (ADR 0012), made by
# .github/workflows/php-build.yml and published as one GitHub Release per
# build, `php-<version>-r<revision>`. One archive per platform, with no top
# folder: bin/php, bin/php-fpm, ext/xdebug.so (loaded with zend_extension=),
# licenses/, and BUILD-INFO.txt. Linux builds need glibc 2.17 or newer.
# The URL is the first build (r1); pins.toml overrides it for a rebuild.

[platform.darwin-arm64]
programs = { php = "bin/php", php-fpm = "bin/php-fpm" }

[[platform.darwin-arm64.artifact]]
name = "php"
url = "https://github.com/XJOC/marsa/releases/download/php-{version}-r1/php-{version}-darwin-arm64.tar.gz"
format = "tar.gz"
strip_components = 0
into = ""

[platform.darwin-x64]
programs = { php = "bin/php", php-fpm = "bin/php-fpm" }

[[platform.darwin-x64.artifact]]
name = "php"
url = "https://github.com/XJOC/marsa/releases/download/php-{version}-r1/php-{version}-darwin-x64.tar.gz"
format = "tar.gz"
strip_components = 0
into = ""

[platform.linux-x64]
programs = { php = "bin/php", php-fpm = "bin/php-fpm" }

[[platform.linux-x64.artifact]]
name = "php"
url = "https://github.com/XJOC/marsa/releases/download/php-{version}-r1/php-{version}-linux-x64.tar.gz"
format = "tar.gz"
strip_components = 0
into = ""

[platform.linux-arm64]
programs = { php = "bin/php", php-fpm = "bin/php-fpm" }

[[platform.linux-arm64.artifact]]
name = "php"
url = "https://github.com/XJOC/marsa/releases/download/php-{version}-r1/php-{version}-linux-arm64.tar.gz"
format = "tar.gz"
strip_components = 0
into = ""

# Windows: the official NTS build. One zip with `php.exe` at the root, next to
# its DLLs. Some releases add a build suffix (`-1`) or use `vs16`; the pinned
# URL in the manifest wins (M2-07).
[platform.windows-x64]
programs = { php = "php.exe", php-cgi = "php-cgi.exe" }

[[platform.windows-x64.artifact]]
name = "zip"
url = "https://windows.php.net/downloads/releases/php-{version}-nts-Win32-vs17-x64.zip"
format = "zip"
strip_components = 0
