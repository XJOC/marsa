# How PHP is laid out on disk (task M2-01). The signed manifest (M2-02) says
# which versions exist, and the real URL and sha256 of each file. This recipe
# says how to unpack them. `url` is a template for `cargo xtask manifest` only:
# the installer never downloads from it.
name = "php"

# After install (M2-05): run the program; its output must start with the text.
[check]
program = "php"
args = ["-v"]
expect_prefix = "PHP {version} "

# macOS and Linux: static-php-cli "bulk" builds (ADR 0010). Two archives, one
# program each, at the archive root: `php` and `php-fpm`.

[platform.darwin-arm64]
programs = { php = "bin/php", php-fpm = "bin/php-fpm" }

[[platform.darwin-arm64.artifact]]
name = "cli"
url = "https://dl.static-php.dev/static-php-cli/bulk/php-{version}-cli-macos-aarch64.tar.gz"
format = "tar.gz"
strip_components = 0
into = "bin"

[[platform.darwin-arm64.artifact]]
name = "fpm"
url = "https://dl.static-php.dev/static-php-cli/bulk/php-{version}-fpm-macos-aarch64.tar.gz"
format = "tar.gz"
strip_components = 0
into = "bin"

[platform.darwin-x64]
programs = { php = "bin/php", php-fpm = "bin/php-fpm" }

[[platform.darwin-x64.artifact]]
name = "cli"
url = "https://dl.static-php.dev/static-php-cli/bulk/php-{version}-cli-macos-x86_64.tar.gz"
format = "tar.gz"
strip_components = 0
into = "bin"

[[platform.darwin-x64.artifact]]
name = "fpm"
url = "https://dl.static-php.dev/static-php-cli/bulk/php-{version}-fpm-macos-x86_64.tar.gz"
format = "tar.gz"
strip_components = 0
into = "bin"

[platform.linux-x64]
programs = { php = "bin/php", php-fpm = "bin/php-fpm" }

[[platform.linux-x64.artifact]]
name = "cli"
url = "https://dl.static-php.dev/static-php-cli/bulk/php-{version}-cli-linux-x86_64.tar.gz"
format = "tar.gz"
strip_components = 0
into = "bin"

[[platform.linux-x64.artifact]]
name = "fpm"
url = "https://dl.static-php.dev/static-php-cli/bulk/php-{version}-fpm-linux-x86_64.tar.gz"
format = "tar.gz"
strip_components = 0
into = "bin"

[platform.linux-arm64]
programs = { php = "bin/php", php-fpm = "bin/php-fpm" }

[[platform.linux-arm64.artifact]]
name = "cli"
url = "https://dl.static-php.dev/static-php-cli/bulk/php-{version}-cli-linux-aarch64.tar.gz"
format = "tar.gz"
strip_components = 0
into = "bin"

[[platform.linux-arm64.artifact]]
name = "fpm"
url = "https://dl.static-php.dev/static-php-cli/bulk/php-{version}-fpm-linux-aarch64.tar.gz"
format = "tar.gz"
strip_components = 0
into = "bin"

# Windows: the official NTS build. One zip with `php.exe` at the root, next to
# its DLLs. Some releases add a build suffix (`-1`) or use `vs16`; the pinned
# URL in the manifest wins (M2-07).
[platform.windows-x64]
programs = { php = "php.exe", php-cgi = "php-cgi.exe" }

[[platform.windows-x64.artifact]]
name = "zip"
url = "https://windows.php.net/downloads/releases/php-{version}-nts-Win32-vs17-x64.zip"
format = "zip"
strip_components = 0
