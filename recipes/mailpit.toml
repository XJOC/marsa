# How Mailpit is laid out on disk. See php.toml for how a recipe and the
# signed manifest work together. Mailpit catches the mail a project sends, so
# none of it leaves the computer.
name = "mailpit"

# After install: `mailpit version --no-release-check` prints
# `<its own path> v1.34.0 compiled with go1.27.4 on darwin/arm64`. The path
# comes first, so the check looks inside the line. `--no-release-check` keeps
# it off the network: without it, Mailpit asks GitHub for its latest release.
[check]
program = "mailpit"
args = ["version", "--no-release-check"]
expect_contains = " v{version} compiled with "

# The official builds from the Mailpit GitHub Releases (MIT): tag
# `v<version>`. Every archive holds `mailpit` (or `mailpit.exe`), LICENSE,
# and README.md at its root, with no top folder. The release has no sum file
# and no attestation: `cargo xtask manifest build` compares each archive with
# the sha256 `digest` GitHub's API reports for that release asset.

# Mailpit is built with the newest Go: the v1.34.0 binaries say `minos 13.0`
# in their Mach-O header, so they need macOS 13 or later.
[platform.darwin-arm64]
min_macos = "13.0"
programs = { mailpit = "mailpit" }

[[platform.darwin-arm64.artifact]]
name = "archive"
url = "https://github.com/axllent/mailpit/releases/download/v{version}/mailpit-darwin-arm64.tar.gz"
format = "tar.gz"

[platform.darwin-x64]
min_macos = "13.0"
programs = { mailpit = "mailpit" }

[[platform.darwin-x64.artifact]]
name = "archive"
url = "https://github.com/axllent/mailpit/releases/download/v{version}/mailpit-darwin-amd64.tar.gz"
format = "tar.gz"

[platform.linux-x64]
programs = { mailpit = "mailpit" }

[[platform.linux-x64.artifact]]
name = "archive"
url = "https://github.com/axllent/mailpit/releases/download/v{version}/mailpit-linux-amd64.tar.gz"
format = "tar.gz"

[platform.linux-arm64]
programs = { mailpit = "mailpit" }

[[platform.linux-arm64.artifact]]
name = "archive"
url = "https://github.com/axllent/mailpit/releases/download/v{version}/mailpit-linux-arm64.tar.gz"
format = "tar.gz"

[platform.windows-x64]
programs = { mailpit = "mailpit.exe" }

[[platform.windows-x64.artifact]]
name = "archive"
url = "https://github.com/axllent/mailpit/releases/download/v{version}/mailpit-windows-amd64.zip"
format = "zip"
