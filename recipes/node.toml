# How Node is laid out on disk (task M2-01). See php.toml for how a recipe and
# the signed manifest work together.
name = "node"

# After install (M2-05): `node --version` prints `v22.11.0`.
[check]
program = "node"
args = ["--version"]
expect_prefix = "v{version}"

# Official builds from nodejs.org. Every archive has one top folder
# (`node-v<version>-<os>-<arch>/`), so one component is stripped. The shim runs
# `npm` and `npx` as `node <npm-cli.js>` (architecture.md section 7).

[platform.darwin-arm64]
programs = { node = "bin/node", npm-cli = "lib/node_modules/npm/bin/npm-cli.js", npx-cli = "lib/node_modules/npm/bin/npx-cli.js" }

[[platform.darwin-arm64.artifact]]
name = "archive"
url = "https://nodejs.org/dist/v{version}/node-v{version}-darwin-arm64.tar.gz"
format = "tar.gz"
strip_components = 1

[platform.darwin-x64]
programs = { node = "bin/node", npm-cli = "lib/node_modules/npm/bin/npm-cli.js", npx-cli = "lib/node_modules/npm/bin/npx-cli.js" }

[[platform.darwin-x64.artifact]]
name = "archive"
url = "https://nodejs.org/dist/v{version}/node-v{version}-darwin-x64.tar.gz"
format = "tar.gz"
strip_components = 1

[platform.linux-x64]
programs = { node = "bin/node", npm-cli = "lib/node_modules/npm/bin/npm-cli.js", npx-cli = "lib/node_modules/npm/bin/npx-cli.js" }

[[platform.linux-x64.artifact]]
name = "archive"
url = "https://nodejs.org/dist/v{version}/node-v{version}-linux-x64.tar.gz"
format = "tar.gz"
strip_components = 1

[platform.linux-arm64]
programs = { node = "bin/node", npm-cli = "lib/node_modules/npm/bin/npm-cli.js", npx-cli = "lib/node_modules/npm/bin/npx-cli.js" }

[[platform.linux-arm64.artifact]]
name = "archive"
url = "https://nodejs.org/dist/v{version}/node-v{version}-linux-arm64.tar.gz"
format = "tar.gz"
strip_components = 1

# Windows: `node.exe` at the root, and `node_modules` without `lib/`.
[platform.windows-x64]
programs = { node = "node.exe", npm-cli = "node_modules/npm/bin/npm-cli.js", npx-cli = "node_modules/npm/bin/npx-cli.js" }

[[platform.windows-x64.artifact]]
name = "archive"
url = "https://nodejs.org/dist/v{version}/node-v{version}-win-x64.zip"
format = "zip"
strip_components = 1
