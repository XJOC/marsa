[package]
name = "marsa-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Marsa window (egui with the wgpu renderer) and the menu-bar icon, two clients of the daemon"

# Two binaries: `marsa-gui` (src/main.rs, the window) and `marsa-tray`
# (src/bin/marsa-tray.rs, the menu-bar icon). The library holds the code of
# both and exists for them only (task M5-04).

[features]
# The measurement mode (`src/measure.rs`, task M5-D10): `MARSA_GUI_MEASURE`
# fills the window with made-up data and times its frames, for a release
# build with no daemon. Off by default, so a shipped binary carries none of
# it; measure with `cargo build -p marsa-gui --release --features measure`.
measure = []

[dependencies]
# With `full` (the default): the window talks to the daemon through
# `marsa_core::client`, like the CLI.
marsa-core = { path = "../core" }
anyhow.workspace = true
eframe.workspace = true
egui_extras.workspace = true
# The native folder picker of "Park a folder…" and "Link a folder…".
rfd.workspace = true
# The type of `Site::php`; the PHP and Node lists compare versions.
semver.workspace = true
# `config/gui.toml`, the window's own preferences (task M5-D9). Both are
# approved for Phase 1 (AGENTS.md section 8) and already in the lock file.
serde.workspace = true
# Reads the level and the message of a Caddy log line (task M5-D10). Approved
# for Phase 1 (AGENTS.md section 8) and already in the lock file.
serde_json.workspace = true
# The menu-bar icon: the event loop, and the icon with its menu.
tao.workspace = true
# The errors of the startup code and the tray, which sit in the library.
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tray-icon.workspace = true

# macOS only: the menu-bar panel's activation policy (`Accessory`: no Dock
# icon, no menu bar). The trait that sets it is in winit, which eframe does
# not re-export. The same winit as eframe's, so no second copy is built.
[target.'cfg(target_os = "macos")'.dependencies]
winit.workspace = true

[dev-dependencies]
# A fake daemon for the bridge's tests, as `marsa-core`'s client tests have.
axum.workspace = true
tempfile.workspace = true
tokio-stream.workspace = true

[lints]
workspace = true
