[package]
name = "marsa-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "All of Marsa's logic, split into modules"

[lib]
name = "marsa_core"

[features]
default = ["full"]
# Modules that start processes or open sockets sit behind this feature, so the
# shim can depend on the core without pulling tokio or reqwest (architecture.md
# section 3). The installer's crates (signature, checksum, archives, logs) are
# here too: only the `installer` module uses them (task M2-01).
full = [
  "dep:tokio",
  "dep:reqwest",
  "dep:notify",
  "dep:minisign-verify",
  "dep:sha2",
  "dep:flate2",
  "dep:tar",
  "dep:zip",
  "dep:tracing",
  "dep:getrandom",
  "dep:windows-sys",
]

[dependencies]
# Optional, so `full` can switch them on with `dep:` and the shim can leave them out.
tokio = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
minisign-verify = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
directories.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true

# `platform::windows` (task M4-19a). Behind `full`, like `platform` itself, so
# the shim never builds it.
[target.'cfg(windows)'.dependencies]
# The helper service's client (task M4-19g1): the pipe, the service
# manager, the user's SID.
windows-sys = { workspace = true, optional = true, features = ["Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Services"] }

[dev-dependencies]
# A fake daemon for the client tests (task M3-08).
axum.workspace = true
insta.workspace = true
tempfile.workspace = true

[lints]
workspace = true
