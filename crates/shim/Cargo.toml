[package]
name = "marsa-shim"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runs php, node, npm, npx, and composer at the version a project asks for, and the database clients at the version their server runs"

[dependencies]
# No default features: the shim must never pull tokio or reqwest
# (architecture.md section 3).
marsa-core = { path = "../core", default-features = false }
semver.workspace = true
thiserror.workspace = true

# Windows: the console's Ctrl+C handler and the Job Object of `sys/windows.rs`
# (task M1-07b). No tokio either way (architecture.md section 3).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
