# Spike S-06: does Caddy survive a crash of marsad, and can the daemon take it
# back? Throwaway code. It is a separate workspace on purpose and never joins
# the product workspace (task S-06).
[workspace]

[package]
name = "s06"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "net", "sync", "fs"] }
tokio-util = "0.7"

# Same lints as the product (AGENTS.md section 6).
[lints.clippy]
await_holding_lock = "deny"
unwrap_used = "deny"

# Case D5: a panic that aborts the process, so no `Drop` runs.
[profile.abort]
inherits = "dev"
panic = "abort"
