# S-11 spike. Independent workspace on purpose: throwaway code in `spikes/`,
# never a member of the product workspace (task S-11). Windows only.
[workspace]
resolver = "3"
members = ["."]

[package]
name = "s11-windows"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
# The SCM dispatcher and service install, instead of hand-written FFI. The
# spike checks that it builds with the pinned toolchain and works as LocalSystem.
windows-service = "0.8"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true

# Same lint policy as the product workspace (architecture.md section 2).
[workspace.lints.clippy]
await_holding_lock = "deny"
unwrap_used = "deny"
