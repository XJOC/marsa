# S-01 spike. Independent workspace on purpose: throwaway code in `spikes/`,
# never a member of the product workspace (task S-01).
[workspace]
resolver = "3"
members = ["."]

[package]
name = "port-probe"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# `std` only: no dependencies.

[lints]
workspace = true

# Same lint policy as the product workspace (architecture.md section 2).
[workspace.lints.clippy]
await_holding_lock = "deny"
unwrap_used = "deny"
