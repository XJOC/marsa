# cargo-deny policy: licenses and advisories for the whole workspace.
[graph]
all-features = true

[advisories]
version = 2
ignore = [
  # Not a vulnerability: `proc-macro-error` is unmaintained. It is a
  # compile-time macro helper of glib-macros 0.18, part of the GTK 3 bindings
  # (gtk 0.18) that tao, muda, and libappindicator need on Linux for the
  # menu-bar icon (task M5-04). gtk-rs has no newer GTK 3 release, and
  # tray-icon has no Linux menu without GTK. Remove this when tao and
  # tray-icon move off gtk 0.18.
  { id = "RUSTSEC-2024-0370", reason = "unmaintained proc-macro-error, compile-time only, through gtk 0.18 (tao, tray-icon) on Linux" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  # Tauri 2 brings five MPL-2.0 crates; the owner accepted it in ADR 0005.
  "MPL-2.0",
  # notify (file watcher) is published under CC0-1.0.
  "CC0-1.0",
  # webpki-root-certs, through reqwest's rustls-platform-verifier.
  "CDLA-Permissive-2.0",
  # clipboard-win and error-code, through eframe's clipboard on Windows. A short
  # permissive license like MIT (task M3-01).
  "BSL-1.0",
]

# egui's bundled fonts. Only this crate may use the two font licenses.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]
